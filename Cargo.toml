[package]
name = "econtoy"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "A tiny agent-based economy simulator for the terminal. Watch emergent inflation, unemployment, credit booms, and fiscal policy play out, or replay scenario files. Educational toy, zero dependencies."
authors = ["printemps.tokyo <develop@printemps.tokyo>"]
repository = "https://github.com/printemps-tokyo/econtoy"
homepage = "https://github.com/printemps-tokyo/econtoy"
readme = "README.md"
keywords = ["economy", "simulation", "agent-based", "cli", "education"]
categories = ["command-line-utilities", "simulation", "science"]

[[bin]]
name = "econtoy"
path = "src/main.rs"

[lib]
name = "econtoy"
path = "src/lib.rs"

[dependencies]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
